desc: Petstore API Test Scenario
runners:
  petstore:
    endpoint: https://petstore.swagger.io/v2

vars:
  petId: 1
  newPetId: 999

steps:
  - desc: Get store inventory
    req: petstore
    get:
      path: /store/inventory
    test: |
      current.res.status == 200
    bind:
      availableCount: current.res.body.available

  - desc: Get pet by ID
    req: petstore
    get:
      path: /pet/{{ vars.petId }}
    test: |
      current.res.status == 200
      current.res.body.id == 1

  - desc: Create a new pet
    req: petstore
    post:
      path: /pet
      body:
        application/json:
          id: "{{ vars.newPetId }}"
          name: Test Dog
          status: available
          category:
            id: 1
            name: Dogs
          photoUrls:
            - https://example.com/photo.jpg
          tags:
            - id: 1
              name: friendly
    test: |
      current.res.status == 200
    bind:
      createdPetId: current.res.body.id

  - desc: Update pet status
    req: petstore
    put:
      path: /pet
      body:
        application/json:
          id: "{{ vars.newPetId }}"
          name: Test Dog Updated
          status: sold
    test: |
      current.res.status == 200

  - desc: Generate UUID for new pet
    bind:
      randomPetId: faker.UUID()
      timestamp: faker.UnixTime()
